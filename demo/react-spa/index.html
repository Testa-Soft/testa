         It auto-raises the overlay on mount (before first paint) when the
         persisted hint says the project has something to hide, and reveals it
         once the variant is applied. Set `shield={false}` to opt out, or pass an
         earlier index.html snippet (buildShieldSnippet() from @testa-soft/dom) —
         raiseShield is idempotent by styleId, so the two compose. -->
