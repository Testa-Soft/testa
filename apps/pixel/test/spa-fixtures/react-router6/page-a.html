    <script>
      /**
       * Simulate React Router 6 initialisation: RR6 calls history.replaceState
       * on startup to attach its own router state object to the current entry.
       * This fires BEFORE React has rendered, potentially racing the pixel.
       * The pixel should redirect exactly once despite this early history mutation.
       */
      (function () {
        var _orig = history.replaceState.bind(history);
        // RR6 normalises the URL on mount — mirror the timing (synchronous, pre-render)
        _orig({ usr: null, key: 'default', idx: 0 }, '', window.location.href);
        window.__rr6RouterState = 'initialized';
      })();
    </script>
